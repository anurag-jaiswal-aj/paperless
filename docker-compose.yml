services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - mongo_data:/data/db
    networks:
      - paperless-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address :9001
    security_opt:
      - no-new-privileges:true
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID:-minio_admin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY:-minio_password}
    volumes:
      - minio_data:/data
    networks:
      paperless-network:
        aliases:
          - minio
          - ${S3_BUCKET:-paperless}.minio
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c "
      set -e
      until /usr/bin/bash -c 'exec 3<>/dev/tcp/minio/9000' 2>/dev/null; do
        sleep 1;
      done
      /usr/bin/mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD
      /usr/bin/mc mb --ignore-existing local/$$S3_BUCKET
      "
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID:-minio_admin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY:-minio_password}
      - S3_BUCKET=${S3_BUCKET:-paperless}
    networks:
      - paperless-network

  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "5000"
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/paperless}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - COOKIE_SAMESITE=${COOKIE_SAMESITE:-lax}
      - FRONTEND_URL=${FRONTEND_URL}
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-${FRONTEND_URL}}
      - TRUST_PROXY=${TRUST_PROXY:-loopback,linklocal,uniquelocal}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-paperless}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minio_admin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minio_password}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-5242880}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@example.com}
    networks:
      - paperless-network

  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=${VITE_API_URL:-}
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      # Expose strictly on loopback (127.0.0.1) by default.
      # Never exposed to 0.0.0.0 without explicit operator override.
      - "${HOST_BIND:-127.0.0.1}:${PORT:-8080}:80"
    networks:
      - paperless-network

volumes:
  mongo_data:
  minio_data:

networks:
  paperless-network:
    driver: bridge
